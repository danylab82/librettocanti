<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repertorio Coro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎵 Repertorio Canti</h1>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cerca per titolo o categoria..." onkeyup="filtraCanti()">
        </div>

        <table id="cantiTable">
            <thead>
                <tr>
                    <th>Titolo</th>
                    <th>Categoria / Momento</th>
                    <th>Tonalità</th>
                </tr>
            </thead>
            <tbody id="cantiBody">
                <!-- I canti verranno inseriti qui automaticamente -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
